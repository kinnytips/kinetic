version: "3.3"

services:
  kinetic:
    #image: ghcr.io/kin-labs/kinetic:1.0.0-rc.6
    build: .  # Build locally instead of pulling image
    restart: unless-stopped
    image: kinetic-versioned:v1.0  # This names your image
    container_name: kinetic-container  # This names your container
    hostname: kinetic
    depends_on:
      - postgres
    # Add memory limits to prevent out-of-memory errors
    deploy:
      resources:
        limits:
          memory: 4G  # Limit to 4 gigabytes
        reservations:
          memory: 2G  # Guarantee at least 2 gigabytes
    ports:
      - '3000:3000'
    environment:
      # See the .env.example file in the GitHub repo for all available options while we work on the docs.
      # https://github.com/kin-labs/kinetic/blob/dev/.env.example
      API_URL: "http://localhost:3000/api"
      AUTH_PASSWORD_ENABLED: "true"
      # Provision users with a coma-separated list.
      # Each item has the form: <username>|<password?>|<role?>:<email?>:<avatarUrl?>
      # The password is optional, when left blank the user can only log in with an external provider.
      # The role is optional and can be one of: Admin and User (default).
      # The email is optional and can be used to link an account to external providers.
      # The avatarUrl is optional and can be used to provision an avatar for the user
      AUTH_USERS: "Greg|kinetic|Admin|gregfitzhugh@mail.com"
      AUTH_PASSWORD: "kinetic"
      # Provision more apps by providing the byte array of the fee payer, name and optionally a logo URL.
      #APP_1_FEE_PAYER_BYTE_ARRAY: "[24,20,238,188,26,234,120,209,88,63,170,46,66,98,21,113,194,120,143,228,231,37,91,0,242,32,180,99,243,179,57,144,11,233,235,235,203,20,105,33,47,140,152,253,12,148,72,175,141,253,242,110,225,110,21,211,118,87,111,206,208,166,190,78]"
      APP_1_FEE_PAYER_SECRET: "3HicmKK88kuwRcvwfiVWMbzTY9mnzmmGuNN4V9Dwn5gCpFYDPCWfR8WmHPAZP4S3DSTPQvNGB4SXdoheCrj49dgW"
      APP_1_NAME: "KinnectedTest"
      COOKIE_DOMAINS: "localhost,local.kinetic.host,pages.dev"
      CORS_BYPASS: "false"
      GITHUB_CLIENT_ID: "Ov23lim9zzgXL9QAn9Ux"
      GITHUB_CLIENT_SECRET: "97c314d8882d46b5122a454402d5f0805a5253f5"
      GITHUB_ENABLED: "true"
      DATABASE_URL: "postgresql://prisma:prisma@postgres:5432/prisma?schema:kinetic"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "4H6(u&KPK6FV!vEa"
      LOG_LEVEL: ALL
      HOST: "0.0.0.0"
      PORT: "3000"
      # SolanaLocal
      SOLANA_LOCAL_ENABLED: "true"
      SOLANA_LOCAL_MINT_KIN: "KinDesK3dYWo3R2wDk6Ucaf31tvQCCSYyL8Fuqp33GX,5,Kin"
      SOLANA_LOCAL_MINT_KIN_AIRDROP_SECRET: "UvfuF3FPqLyvS8xGjSu4AUfdsY5QvLdnin8SKBLAi3UqgbmEWCCSYyL8Fuqp33GX"
      SOLANA_LOCAL_RPC_ENDPOINT: "http://localhost:8899"
      # SolanaDevnet
      # Devnet is enabled by default, you need to explicitly enable mainnet.
      SOLANA_DEVNET_ENABLED: "true"
      #SOLANA_MAINNET_ENABLED: "true"
      
      WEB_URL: "http://localhost:3000"
    logging:
      options:
        max-size: 100m

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.0.5-alpine
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - ./volumes/redis:/data